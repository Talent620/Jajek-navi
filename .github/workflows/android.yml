name: Build Android APK

# Buduje podpisany APK (klucz demo) i publikuje go jako Release do pobrania.
# Aplikacja sama sprawdza GitHub Releases i proponuje aktualizację.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tomtom-field-nav-android-qfbbrz
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Wersja: $VERSION (code ${{ github.run_number }})"

      - name: Build web bundle
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_MAPBOX_STYLE: ${{ secrets.VITE_MAPBOX_STYLE }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          # Klucz demo jest w repo; sekrety nadpisują go w razie potrzeby.
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/jajek-navi-${{ steps.ver.outputs.version }}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jajek-navi-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Jajek Navi v${{ steps.ver.outputs.version }}
          body: |
            Automatyczny build APK (podpis demo).
            Pobierz `jajek-navi-${{ steps.ver.outputs.version }}.apk`, włącz w Androidzie
            instalację z nieznanych źródeł i zainstaluj. Aplikacja sama wykryje
            kolejne aktualizacje przez GitHub Releases.

            versionCode: ${{ steps.ver.outputs.code }}
          files: out/*.apk
          make_latest: true
